name: Deploy demo projects

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
  workflow_dispatch: {}

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Vercel's CLI checks that the HEAD commit's author email matches a
      # Vercel team member before it will create a deployment from CI — a
      # mismatch here silently "Blocks" the deployment and vercel --prod
      # then hangs polling it forever (this is what cost us a 6-hour stuck
      # run once already). Pin the author explicitly so a bad local git
      # config can never cause that again, regardless of what authored the
      # commit.
      - name: Normalize commit author for Vercel's permission check
        run: |
          git config user.name "mohammad"
          git config user.email "mohammadelia30@gmail.com"
          git commit --amend --no-edit --reset-author --allow-empty

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # On a normal push, only redeploy the project folders that actually
      # changed. On a manual run (workflow_dispatch), redeploy everything —
      # useful after rotating a secret or as a sanity check.
      - name: Determine changed projects
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DIRS=$(find projects -mindepth 1 -maxdepth 1 -type d | sort)
          else
            DIRS=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- projects \
              | awk -F/ 'NF>=2 {print "projects/"$2}' | sort -u)
          fi
          echo "dirs<<DELIM" >> "$GITHUB_OUTPUT"
          echo "$DIRS" >> "$GITHUB_OUTPUT"
          echo "DELIM" >> "$GITHUB_OUTPUT"
          echo "Projects to deploy:"
          echo "$DIRS"

      - name: Deploy changed projects to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            if [ ! -f "$dir/.vercel/project.json" ]; then
              echo "::warning::Skipping $dir — no .vercel/project.json, not linked to a Vercel project yet"
              continue
            fi
            echo "::group::Deploying $dir"
            (cd "$dir" && timeout 300 vercel --prod --yes --token="$VERCEL_TOKEN")
            status=$?
            echo "::endgroup::"
            if [ $status -ne 0 ]; then
              echo "::error::Deploy of $dir failed or timed out (exit $status)"
              exit $status
            fi
          done <<< "${{ steps.changed.outputs.dirs }}"
