<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Toolkit — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="tag">Backend + frontend demo</p>
    <h1>The Vault</h1>
    <p class="desc">Combinations are cut with Node's <code>crypto.randomInt</code> on the server, and strength is scored there too — the dial below reads what the backend decides.</p>
  </header>

  <div class="panel">
    <div class="pw-out">
      <input id="output" type="text" readonly>
      <button id="copy" class="ghost">Copy</button>
    </div>
    <div class="slider-row">
      <span>Length</span>
      <input type="range" id="length" min="6" max="48" value="16">
      <span id="length-val">16</span>
    </div>
    <div class="options">
      <label><input type="checkbox" id="upper" checked> Uppercase</label>
      <label><input type="checkbox" id="numbers" checked> Numbers</label>
      <label><input type="checkbox" id="symbols" checked> Symbols</label>
    </div>
    <button id="generate">Cut new combination</button>
  </div>

  <div class="panel">
    <strong>Test a combination</strong>
    <input type="text" id="check" placeholder="Type a password to score it">

    <div class="dial-wrap">
      <svg class="dial" viewBox="0 0 140 78">
        <path class="dial-track" d="M14,70 A56,56 0 0,1 126,70" />
        <path class="dial-fill" id="dial-fill" d="M14,70 A56,56 0 0,1 126,70" />
        <g id="needle-group">
          <line class="needle" x1="70" y1="70" x2="70" y2="22"></line>
        </g>
        <circle class="hub" cx="70" cy="70" r="6" />
      </svg>
      <div class="strength-label" id="label">—</div>
    </div>
    <div class="issues" id="issues"></div>
  </div>

  <footer>
    <a href="https://github.com/" id="source-link" target="_blank" rel="noopener">View source on GitHub</a>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
