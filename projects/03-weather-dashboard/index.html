<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Dashboard — demo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="tag">Backend + Frontend demo</p>
    <h1>Weather Dashboard</h1>
    <p class="desc">The backend geocodes your city and proxies a free forecast API — no key needed, no CORS issues.</p>
  </header>

  <div class="card">
    <form id="form" class="row">
      <input id="city" type="text" placeholder="Toronto" required>
      <button type="submit">Search</button>
    </form>
    <div id="error" class="error"></div>
  </div>

  <div id="result" class="card" style="display:none">
    <p class="place" id="place"></p>
    <div class="current">
      <span class="temp" id="temp"></span>
      <span class="meta" id="meta"></span>
    </div>
    <div class="days" id="days"></div>
  </div>

  <footer>
    <a href="https://github.com/" id="source-link" target="_blank" rel="noopener">View source on GitHub</a>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
