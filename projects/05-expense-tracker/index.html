<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker — demo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="tag">Backend + Frontend demo</p>
    <h1>Expense Tracker</h1>
    <p class="desc">The backend aggregates totals and category breakdowns on every request — the frontend just renders numbers it's handed.</p>
  </header>

  <div class="card">
    <form id="form" class="grid3">
      <input id="label" type="text" placeholder="What did you buy?" required>
      <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
      <input id="category" type="text" placeholder="Category" value="Other">
    </form>
    <button type="submit" form="form">Add expense</button>
    <div id="error" class="error"></div>
  </div>

  <div class="card">
    <div class="total" id="total">$0.00<span>Total spent</span></div>
    <div id="categories"></div>
  </div>

  <div class="card">
    <div id="list" class="list"></div>
  </div>

  <footer>
    <a href="https://github.com/" id="source-link" target="_blank" rel="noopener">View source on GitHub</a>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
