<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Orbit Analytics</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">OA</div>
      <div class="name" data-workspace-name>Orbit Analytics</div>
    </div>
    <div class="nav-group">
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Overview
      </a>
      <a class="nav-item" href="customers.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Customers
      </a>
      <a class="nav-item active" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </a>
    </div>
    <div class="sidebar-footer">
      <div class="user">
        <div class="avatar">AC</div>
        <div class="meta">
          <div class="wname">Alex Carter</div>
          <div class="role">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Settings</h1>
        <div class="sub">Saved through a real API call — reload the page and your changes are still there.</div>
      </div>
      <a href="https://github.com/" id="source-link" target="_blank" rel="noopener" class="btn" style="background:var(--card-2);color:var(--text);border:1px solid var(--border)">View source</a>
    </div>
    <div class="content">
      <div class="settings-card">
        <form id="settings-form">
          <div class="form-group">
            <label>Workspace name</label>
            <input type="text" name="workspaceName" id="workspaceName">
          </div>
          <div class="form-group">
            <label>Timezone</label>
            <select name="timezone" id="timezone">
              <option value="America/Toronto">America/Toronto</option>
              <option value="America/New_York">America/New_York</option>
              <option value="America/Los_Angeles">America/Los_Angeles</option>
              <option value="Europe/London">Europe/London</option>
              <option value="Europe/Berlin">Europe/Berlin</option>
              <option value="Asia/Dubai">Asia/Dubai</option>
              <option value="Asia/Tehran">Asia/Tehran</option>
            </select>
          </div>
          <div class="form-group">
            <div class="toggle-row">
              <div>
                <div class="t-label">Weekly digest email</div>
                <div class="t-sub">A summary of revenue and new signups, every Monday.</div>
              </div>
              <div class="switch" id="digest-switch"><div class="knob"></div></div>
            </div>
          </div>
          <button type="submit" class="btn">Save changes</button>
          <span class="save-note" id="save-note">Saved ✓</span>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
<script src="settings.js"></script>
</body>
</html>
