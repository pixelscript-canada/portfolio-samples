<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers — Orbit Analytics</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">OA</div>
      <div class="name" data-workspace-name>Orbit Analytics</div>
    </div>
    <div class="nav-group">
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Overview
      </a>
      <a class="nav-item active" href="customers.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Customers
      </a>
      <a class="nav-item" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </a>
    </div>
    <div class="sidebar-footer">
      <div class="user">
        <div class="avatar">AC</div>
        <div class="meta">
          <div class="wname">Alex Carter</div>
          <div class="role">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Customers</h1>
        <div class="sub">Search, sort and pagination all happen server-side in <code>/api/customers</code>.</div>
      </div>
      <a href="https://github.com/" id="source-link" target="_blank" rel="noopener" class="btn" style="background:var(--card-2);color:var(--text);border:1px solid var(--border)">View source</a>
    </div>
    <div class="content">
      <div class="panel">
        <div class="table-toolbar">
          <input type="search" id="search" placeholder="Search name, email or company…">
          <select id="status-filter">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="trial">Trial</option>
            <option value="churned">Churned</option>
          </select>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th data-sort="name">Customer<span class="arrow"></span></th>
                <th data-sort="company">Company<span class="arrow"></span></th>
                <th data-sort="plan">Plan<span class="arrow"></span></th>
                <th data-sort="mrr">MRR<span class="arrow"></span></th>
                <th data-sort="status">Status<span class="arrow"></span></th>
                <th data-sort="joinedAt">Joined<span class="arrow"></span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
<script src="customers.js"></script>
</body>
</html>
