<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Generator — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="tag">backend + frontend demo</p>
    <h1>PROOF&nbsp;SHEET</h1>
    <p class="desc">The PNG is rendered entirely on the server with the <code>qrcode</code> npm package — the frontend just points an <code>&lt;img&gt;</code> at the API.</p>
  </header>

  <div class="sheet">
    <div class="corner tl">✛</div>
    <div class="corner tr">✛</div>
    <div class="corner bl">✛</div>
    <div class="corner br">✛</div>

    <form id="form">
      <input id="text" type="text" placeholder="Enter text or a URL" value="https://github.com">
      <button type="submit">Render plate</button>
    </form>

    <div class="qr-box">
      <img id="qr" src="" alt="QR code">
    </div>

    <div class="cmyk">
      <span class="swatch c"></span>
      <span class="swatch m"></span>
      <span class="swatch y"></span>
      <span class="swatch k"></span>
      <span class="spec">100% · 600×600 · PNG</span>
    </div>
  </div>

  <footer>
    <a href="https://github.com/" id="source-link" target="_blank" rel="noopener">View source on GitHub</a>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
