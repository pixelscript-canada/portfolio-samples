<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Notes — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="tag">Backend + Frontend demo — Manuscript No. 1</p>
    <h1>The Editor's Desk</h1>
    <p class="desc">Markdown is set to type on the server (a hand-written parser in <code>/api/render</code>), then filed to the notes API — the manuscript on the left, the typeset page on the right.</p>
  </header>

  <div class="card">
    <input id="title" type="text" placeholder="Note title" value="Untitled">
    <div class="split">
      <div class="pane">
        <label>manuscript</label>
        <textarea id="editor" rows="10"># Hello

Type **Markdown** here…</textarea>
      </div>
      <div class="pane">
        <label>typeset page</label>
        <div class="preview" id="preview"></div>
      </div>
    </div>
    <button id="save">File this note</button>
  </div>

  <div class="card">
    <label>filed notes</label>
    <div id="list"></div>
  </div>

  <footer>
    <a href="https://github.com/" id="source-link" target="_blank" rel="noopener">View source on GitHub</a>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
