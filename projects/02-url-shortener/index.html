<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Shortener — demo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="tag">Backend + Frontend demo</p>
    <h1>URL Shortener</h1>
    <p class="desc">Paste a long URL and get back a short code. The backend generates the code, stores the mapping, and 302-redirects on visit.</p>
  </header>

  <div class="card">
    <form id="form" class="row">
      <input id="url" type="url" placeholder="https://example.com/a/very/long/path" required>
      <button type="submit">Shorten</button>
    </form>
    <div id="result" class="result">
      Short link: <a id="short-link" target="_blank" rel="noopener"></a>
    </div>
    <div id="error" class="error"></div>
  </div>

  <div class="card">
    <div id="list" class="list"></div>
  </div>

  <footer>
    <a href="https://github.com/" id="source-link" target="_blank" rel="noopener">View source on GitHub</a>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
