<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo List API — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="pad">
    <header>
      <p class="tag">backend + frontend demo</p>
      <h1>The Daily Docket</h1>
      <p class="desc">Every line on this pad is a real row on the server — <code>/api/todos</code> stores it, checks it off, and deletes it. Nothing here is just localStorage pretending.</p>
    </header>

    <form id="form" class="row">
      <span class="prompt">&gt;</span>
      <input id="title" type="text" placeholder="type a task and hit add…" required autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <div id="list" class="list"></div>
  </div>

  <footer>
    <a href="https://github.com/" id="source-link" target="_blank" rel="noopener">View source on GitHub</a>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
