<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo List API — demo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="tag">Backend + Frontend demo</p>
    <h1>Todo List API</h1>
    <p class="desc">Tasks are stored server-side via a REST API (<code>/api/todos</code>). Add, complete and delete — every action is a real HTTP call.</p>
  </header>

  <div class="card">
    <form id="form" class="row">
      <input id="title" type="text" placeholder="Add a task…" required>
      <button type="submit">Add</button>
    </form>
  </div>

  <div class="card">
    <div id="list" class="list"></div>
  </div>

  <footer>
    <a href="https://github.com/" id="source-link" target="_blank" rel="noopener">View source on GitHub</a>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
